# Reverse proxy nginx pour le panel HeiphaisBot (à placer dans /etc/nginx/sites-available/heiphaisbot puis lier dans sites-enabled)
# Certificat : sudo certbot --nginx -d bot.mondomaine.fr
server {
    listen 80;
    server_name bot.mondomaine.fr;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }
}
